<!DOCTYPE html>
<html lang="ru"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .breadcrumb {
            list-style: none;
            display: flex;
            padding: 0;
            margin: 0;
        }
        .breadcrumb li {
            margin-right: 5px;
        }
        .breadcrumb li span {
            color: gray;
        }
        .middle_block {
            margin-top: 20px;
            margin-left: 20px;
            color: red;
        }
        label{
            margin-right: 50px;
            margin-left: 20px;
            margin-bottom: 20px;
        }
        input, select, textarea{
            margin-left: 30px;
        }
        .page {
            width: 1020px;
            max-width: 100%;
            margin: 0 auto;
            border: 2px solid #222222;
            
        }
        nav {
            border-top: 2px solid #222222;
            margin-top: 20px;
            border-bottom: 2px solid #222222;
            padding: 10px 0;
        }
    </style>
    <title>Conversion Template Form</title>
    <body> 
        <div class="page">
            <form action="mailto:example@mail.ru" method="post" enctype="multipart/form-data">  
            <header class="header">
                <h1>Dynamic Converter New HTML Conversion Template Form</h1>
                <nav>
                    <ul class="breadcrumb">
                        <li><a href="/">Administration</a></li>
                        <li><a href="/converter_admin/">Dynamic Converter Admin</a></li>
                        <li aria-current="page"><span>Dynamic Converter New HTML Form</span></li>
                    </ul>
                </nav> 
            </header>
            <main class="main_form">
            <section class="top_block">
                <p><label for="content-id">* Content ID</label> 
                    <input type="text" id="content-id">
                </p> 
                <p><label for="type">* Type</label>
                    <select id="type">
                        <option>ADACCT - Acme Accaunting Department</option>
                        <option>item_2</option>
                        <option>item_3</option>                    </select>
                </p>
                <p>
                    <label for="title">* Title</label>
                    <input type="text" id="title">
                </p>
                <p>
                    <label for="filer">* Filer</label>
                    <input type="text" id="filer">
                    <select>
                        <option>sysadmin</option>
                        <option>item_2</option>
                        <option>item_3</option>
                    </select>
                </p>
                <p>
                    <label for="security-group">* Security Group</label>
                    <select id="security-group">
                        <option>Public</option>
                        <option>Private</option>
                    </select>
                </p>
            </section>
            <section class="middle_block">
                <table>
                    <tbody>
                        <tr>
                            <td class="label-cell"> 
                                <label for="template-format">Template Format</label>
                            </td>
                            <td class="input-cell">
                                <input type="radio" id="template-format" name="template-format" value="html" checked>HTML ConversionTemplate</input>
                            </td>
                            <td class="input-cell">
                                <input type="radio" id="template-format" name="template-format" value="classic-html">Classic HTML Conversion Template</input>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
            <section class="bottom_block">
                <p>
                    <label for="revision">* Revision</label>
                    <input type="number" id="revision" min="0" value="1">
                </p>
                <p>
                    <label for="folder">Folder</label>
                    <input type="text" id="folder">
                    <button type="file">Browse...</button>
                </p>
                <p>
                    <label for="hidden">Hidden</label>
                    <input id="hidden" type="checkbox" name="true">true</input>
                    <input id="hidden" type="checkbox" name="false" checked>false</input>
                </p>
                <p>
                    <label for="comments">Comments</label>
                    <textarea id="comments" rows="4" cols="50"></textarea>
                </p>
                <p>
                    <label for="user-access-list">User Access List</label>
                    <textarea id="user-access-list" rows="4" cols="50"></textarea>
                </p>
                <p>
                    <label for="trash-delete-old-name">Trash Delete Old Name</label>
                    <textarea id="trash-delete-old-name" rows="4" cols="50"></textarea>
                </p>
                <p>
                    <label for="trash-delete-location">Trash Delete Location</span> 
                    <input id="trash-delete-location" type="text">
                    <button id="trash-delete-location" type="file">Browse...</button>
                </p>
                </p>
                    <label for="trash-delete-date">Trash Delete Date</label> 
                    <input id="trash-delete-date" type="date">
                    <button id="trash-delete-date" type="calendar">
                        <img src="calendar-icon.png" alt="Calendar Icon" width="20" height="20">
                    </button>
                </p>
            </section>
            </main>
            </form>
        </div>

    </body>
